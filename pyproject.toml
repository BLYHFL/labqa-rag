[project]
name = "labqa-rag"
version = "2.0.0"
description = "实验室智能问答系统 — 基于 LangChain + FAISS + BM25 + RRF 混合检索的 RAG 知识库问答"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    # LangChain 核心
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-core>=0.3.0",
    # 向量检索
    "faiss-cpu>=1.8.0",
    # 稀疏检索
    "rank-bm25>=0.2.2",
    # Ollama（本地 LLM + Embedding）
    "ollama>=0.4.0",
    # 云端 API
    "httpx>=0.25.0",
    # 飞书 SDK（长连接模式）
    "lark-oapi>=1.6.0",
    # 文档转换（可选）
    "python-docx>=1.0.0",
    "python-pptx>=0.6.0",
    "openpyxl>=3.0.0",
    # 工具
    "python-dotenv>=1.0.0",
    "tiktoken>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
labqa = "labqa.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/labqa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
